name: Build ZMK with Nix

on:
  push:
    branches:
      - keymap-editor
      - forgejo-ci
  workflow_dispatch:

jobs:
  build:
    runs-on: opi5pro-docker
    container:
      image: node:24-bookworm
      options: --cpuset-cpus=4-7
      volumes:
        - /srv/forgejo-runner/nix:/nix

    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y curl xz-utils git ca-certificates sudo bash

      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Apply keymap editor compatibility fixes
        run: |
          chmod +x scripts/fix_fake_behaviors.sh
          ./scripts/fix_fake_behaviors.sh
          git diff -- config/jaan.keymap || true

      - name: Install Nix
        run: |
          curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix \
            | sh -s -- install linux --init none --no-confirm

      - name: Restore west cache
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            .west
            zmk
            zephyr
            modules
            bootloader
            tools
          key: zmk-west-${{ runner.os }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            zmk-west-${{ runner.os }}-

      - name: Build firmware
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --extra-experimental-features 'nix-command flakes' develop --command just init
          nix --extra-experimental-features 'nix-command flakes' develop --command just build all

      - name: Show firmware output
        run: |
          find firmware -maxdepth 2 -type f -ls || true

      - name: Upload firmware to Forgejo web UI
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: firmware
          path: firmware/

  copy-to-macmini:
    runs-on: opi5pro-host
    needs: build
    steps:
      - name: Download firmware artifact from Forgejo web UI
        uses: https://data.forgejo.org/actions/download-artifact@v3
        with:
          name: firmware
          path: firmware/

      - name: Copy firmware to macmini
        run: |
          set -euo pipefail

          remote_dir="/Volumes/manzel/hamid/Downloads/zmk-firmware/${{ forgejo.repository }}/${{ forgejo.run_number }}"

          ssh macmini "mkdir -p '$remote_dir'"
          scp firmware/* "macmini:$remote_dir/"

          GREEN=$'\e[0;32m'
          NC=$'\e[0m'
          CYAN=$'\e[1;34m'
          printf "Copied new %sfirmware%s to macOS: %s~/%s%s\n" \
                  "$GREEN" "$NC" "$CYAN" \
                  "Downloads/zmk-firmware/${{ forgejo.repository }}/${{ forgejo.run_number }}" "$NC"
